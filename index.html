<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bazzigar_Satka_Matka - Join Telegram</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Main Container */
    main {
      width: 100%;
      max-width: 480px;
      padding: 20px 16px;
      text-align: center;
    }

    /* Profile Box */
    .profile-box {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 15px auto;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #222938;
      background-color: #1f293d;
    }

    .badge-check {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: #229ed9;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid #0b0e14;
    }

    /* Text Headers */
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      line-height: 1.3;
      color: #229ed9;
    }

    .subscriber-tag {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* Features Section */
    .features-card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 30px;
      text-align: left;
      line-height: 1.6;
    }

    .features-card p {
      font-size: 16px;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .features-card p:last-child {
      margin-bottom: 0;
    }

    /* Join Button */
    .btn-join {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #229ed9, #0088cc);
      color: #ffffff;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 18px;
      box-shadow: 0 8px 20px rgba(34, 158, 217, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-join:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <main>
    <!-- Profile Box -->
    <div class="profile-box">
      <!-- 'gautamjha.jpg' link ke liye local me image save karein -->
      <img src="gautamjha.jpg" alt="Logo" class="profile-img" width="150" height="150" loading="eager">
      <div class="badge-check">✓</div>
    </div>

    <h1>Bazzigar_Satka_Matka</h1>
    <p class="subscriber-tag">172 subscribers</p>

    <!-- Features Section -->
    <section class="features-card">
      <p>फरीदाबाद से दिसावर 🔥</p>
      <p>रोजाना 4 में से 3 लोकेशन पास 🔥</p>
      <p>महीने में 26/27 दिन पासिंग का वादा 💯 ...</p>
    </section>

    <!-- Join Button with Link -->
    <a href="https://t.me/+spL1z2ZEKQE4MTM1" class="btn-join" target="_blank">✈️ JOIN CHANNEL</a>
  </main>

</body>
</html>
